name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          workspaces: |
            . -> target
            website -> website/target

      - name: Rustfmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --all --manifest-path website/Cargo.toml -- --check

      # Default workspace members only; ff13-hooks (Windows-only DLL) and
      # chronostasis-gui (heavy wgpu build) are covered by their own jobs below.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy website
        run: cargo clippy --locked --manifest-path website/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  gui:
    name: GUI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui

      - name: Clippy
        run: cargo clippy --locked -p chronostasis-gui --all-targets -- -D warnings

      # Tests that need game data skip themselves when FF13_GAME_DIR is unset.
      - name: Test
        run: cargo test --locked -p chronostasis-gui

  dll:
    name: Proxy DLL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: i686-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: i686-pc-windows-gnu

      - name: Clippy d3d9.dll proxy
        env:
          CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER: i686-w64-mingw32-gcc
        run: cargo clippy --locked -p ff13-hooks --target i686-pc-windows-gnu --all-targets -- -D warnings

      # Release profile (lto, codegen-units=1) so linker issues surface here, not mid-release.
      - name: Build d3d9.dll proxy
        env:
          CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER: i686-w64-mingw32-gcc
        run: cargo build --locked -p ff13-hooks --target i686-pc-windows-gnu --release

      # Release binaries embed the DLL; make sure the feature-gated path compiles.
      - name: Check bundled-dll feature
        env:
          CHRONOSTASIS_BUNDLED_DLL: ${{ github.workspace }}/target/i686-pc-windows-gnu/release/d3d9.dll
        run: cargo check --locked -p chronostasis-cli --features bundled-dll
