name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          workspaces: |
            . -> target
            website -> website/target

      - name: Rustfmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --all --manifest-path website/Cargo.toml -- --check

      # chronostasis-gui (heavy wgpu build) is covered by its own job below.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy website
        run: cargo clippy --locked --manifest-path website/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  gui:
    name: GUI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui

      - name: Clippy
        run: cargo clippy --locked -p chronostasis-gui --all-targets -- -D warnings

      # Tests that need game data skip themselves when FF13_GAME_DIR is unset.
      - name: Test
        run: cargo test --locked -p chronostasis-gui
