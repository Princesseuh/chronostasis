[package]
name = "chronostasis-cli"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for Chronostasis, the FFXIII modding suite (game discovery, LAA patch, proxy install, mod tooling)."
readme = "README.md"
keywords = ["final-fantasy", "ffxiii", "modding", "cli", "proton"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "chronostasis"
path = "src/main.rs"

[features]
# Embed the prebuilt proxy d3d9.dll so `install` needs no DLL path (forwards to ff13, which
# owns the embed). The release CI builds the DLL first and sets CHRONOSTASIS_BUNDLED_DLL.
bundled-dll = ["ff13/bundled-dll"]

[dependencies]
ff13.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
