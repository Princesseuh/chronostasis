[package]
name = "chronostasis-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line format and modding tools for the Final Fantasy XIII trilogy."
readme = "README.md"
keywords = ["final-fantasy", "ffxiii", "modding", "cli", "proton"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "chronostasis"
path = "src/main.rs"

[dependencies]
ff13.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
