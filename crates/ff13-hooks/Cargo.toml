[package]
name = "ff13-hooks"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process d3d9.dll for FFXIII: runtime hooks and Nova-style code patches."
publish = false

[lib]
# Produces `d3d9.dll` directly, the name the game (and Wine) loads.
name = "d3d9"
crate-type = ["cdylib"]

# Only built for 32-bit Windows:
#   cargo build -p ff13-hooks --release --target i686-pc-windows-gnu
[target.'cfg(windows)'.dependencies]
ff13-formats = { workspace = true }
minhook = "0.9"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_WindowsAndMessaging",
] }
